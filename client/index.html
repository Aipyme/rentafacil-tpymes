          "name": "¿Cuándo empieza la campaña de la renta 2025?",

            "@type": "Answer",
            "text": "La campaña de la renta 2025 (ejercicio fiscal 2024) comienza en abril de 2026 y finaliza el 30 de junio de 2026. Puedes empezar a preparar tu declaración ahora con nuestro simulador gratuito."

          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Estás obligado a declarar si tus rendimientos del trabajo superan los 22.000 € anuales de un solo pagador, o 15.000 € si tienes más de un pagador. Nuestro simulador gratuito te indica en 2 minutos si estás obligado y cuánto puedes recuperar."
          }

          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Necesitarás el DNI/NIE, el borrador de la AEAT (disponible en Cl@ve PIN), certificados de retenciones de tu empresa, y en casos específicos: escrituras de inmuebles, recibos del IBI, o documentación de actividades económicas. Nuestro equipo te indica exactamente qué necesitas según tu caso."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo hacer la declaración de la renta online?",
